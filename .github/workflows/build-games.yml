name: Build Games Manifest
on:
  push:
    paths:
      - 'games/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate games.json
        run: |
          python3 -c '
          import os, json
          games_dir = "games"
          result = []
          if os.path.isdir(games_dir):
              for folder in sorted(os.listdir(games_dir)):
                  full_path = os.path.join(games_dir, folder)
                  if os.path.isdir(full_path):
                      files = sorted(os.listdir(full_path))
                      result.append({"folder": folder, "files": files})
          with open("games.json", "w") as f:
              json.dump(result, f, indent=2)
          '

      - name: Commit and push games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update games.json"
          git push
